<!DOCTYPE html> <!-- ! -->
<html lang="en">
<link>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda | DMK Fishing Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<script src="js/contador_carrito.js"></script>
<body>
  <main class="desktop">

    <header class="header">
      <img src="img_header/logo_header.png" alt="DMK Fishing Store" class="logo">

      <nav class="navbar">
        <a href="index.html">INICIO</a>
        <a href="tienda.html">TIENDA</a>
        <a href="nosotros.html">NOSOTROS</a>
        <a href="contacto.html">CONTACTO</a>
      </nav>

      <div class="header-icons">
        
        <a href="pantalla_carrito.html" class="enlace-carrito">
            <img
                src="img_header/carrito_icon.png"
                alt="Ver carrito"
                class="header-icon-img"
            >

            <span id="contadorCarrito" class="contador-carrito">
                0
            </span>
        </a>
      </div>
    </header>

    <section class="buscador-section">

        <div class="ordenar">
            <label for="ordenarProductos">Ordenar por:</label>

            <select id="ordenarProductos">
                <option value="recientes">Más recientes</option>
                <option value="az">A-Z</option>
                <option value="za">Z-A</option>
                <option value="precioAsc">Precio ↑</option>
                <option value="precioDesc">Precio ↓</option>
            </select>
        </div>

        <div class="buscador">
            <input type="text" id="buscarProducto" placeholder="Buscar productos...">

            <button id="btnBuscar">
                <img src="img_tienda/search_icon.png" alt="Buscar">
            </button>
        </div>

    </section>

        <section class="categorias-tienda">

            <button class="categoria-activa" data-categoria="Todos">
                Todos
            </button>

            <button data-categoria="Cañas">
                Cañas
            </button>

            <button data-categoria="Carretes">
                Carretes
            </button>

            <button data-categoria="Señuelos">
                Señuelos
            </button>

            <button data-categoria="Ropa">
                Ropa
            </button>

        </section>

        <section class="productos-tienda" id="lista-productos">
            <!-- Aquí JavaScript agregará los productos -->
        </section>

        <section class="paginacion">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
        </section>

        <footer class="footer">
            <img src="img_footer/pescado_decorativo_footer.png" alt="" class="footer-decoracion-pescado">

            <div class="footer-texto">
                <h2>¿Necesitás ayuda?</h2>
                <p>Te asesoramos para encontrar el equipo ideal.</p>
            </div>

            <img src="img_footer/cangrejo_decorativo_footer.png" alt="" class="footer-decoracion-cangrejo">

            <div class="footer-redes">
                <a href="" target="_blank">
                    <img src="img_footer/logo_whatsapp_footer.png" alt="WhatsApp">
                </a>

                <a href="https://www.instagram.com/store_dmk?igsh=MmlsZzRmYTc1ODk5" target="_blank">
                    <img src="img_footer/logo_insta_footer.png" alt="Instagram">
                </a>

                <a href="https://www.facebook.com/share/14envQaKYx1/" target="_blank">
                    <img src="img_footer/logo_facebook_footer.png" alt="Facebook">
                </a>

                <a href="https://www.tiktok.com/@dmkfishing?_r=1&_t=ZS-96pMe8b1P9x" target="_blank">
                    <img src="img_footer/logo_tiktok_footer.png" alt="TikTok">
                </a>
            </div>

            <p class="copyright">
                © 2026 DMK Fishing Store · Todos los derechos reservados
            </p>
            </footer>

    </main>
    <script src="js/tienda.js"></script>

</body>

</html>
