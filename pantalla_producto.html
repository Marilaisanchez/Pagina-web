<!DOCTYPE html> <!-- ! -->
<html lang="en">
<link>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda | DMK Fishing Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="desktop">

    <header class="header">
      <img src="img_header/logo_header.png" alt="DMK Fishing Store" class="logo">

      <nav class="navbar">
        <a href="index.html">INICIO</a>
        <a href="tienda.html">TIENDA</a>
        <a href="nosotros.html">NOSOTROS</a>
        <a href="contacto.html">CONTACTO</a>
      </nav>

      <div class="header-icons">
        <img src="img_header/search_icon.png" alt="Buscar" class="header-icons img">
        <a href="pantalla_carrito.html" class="enlace-carrito">
            <img
                src="img_header/carrito_icon.png"
                alt="Ver carrito"
                class="header-icon-img"
            >

            <span id="contadorCarrito" class="contador-carrito">
                0
            </span>
        </a>
      </div>
    </header>

    <main class="detalle-producto">

        <div class="detalle-imagen">
            <img id="imagenProducto" src="" alt="">
        </div>

        <div class="detalle-info">

            <a href="tienda.html" class="volver">
                ← Volver a la tienda
            </a>

            <p id="categoriaProducto" class="categoria-producto"></p>

            <h1 id="nombreProducto"></h1>

            <p id="modeloProducto" class="modelo-producto"></p>

            <h2 id="precioProducto" class="precio-producto"></h2>

            <p id="descripcionProducto" class="descripcion-producto"></p>

            <div class="caracteristicas-producto">
                <h3>Características</h3>
                <ul id="listaDetalles"></ul>
            </div>

            <button class="btn-comprar">
                Agregar al carrito
            </button>

        </div>

    </main>

    <script src="js/producto.js"></script>

    <footer class="footer">
            <img src="img_footer/pescado_decorativo_footer.png" alt="" class="footer-decoracion-pescado">

            <div class="footer-texto">
                <h2>¿Necesitás ayuda?</h2>
                <p>Te asesoramos para encontrar el equipo ideal.</p>
            </div>

            <img src="img_footer/cangrejo_decorativo_footer.png" alt="" class="footer-decoracion-cangrejo">

            <div class="footer-redes">
                <a href="" target="_blank">
                    <img src="img_footer/logo_whatsapp_footer.png" alt="WhatsApp">
                </a>

                <a href="https://www.instagram.com/store_dmk?igsh=MmlsZzRmYTc1ODk5" target="_blank">
                    <img src="img_footer/logo_insta_footer.png" alt="Instagram">
                </a>

                <a href="https://www.facebook.com/share/14envQaKYx1/" target="_blank">
                    <img src="img_footer/logo_facebook_footer.png" alt="Facebook">
                </a>

                <a href="https://www.tiktok.com/@dmkfishing?_r=1&_t=ZS-96pMe8b1P9x" target="_blank">
                    <img src="img_footer/logo_tiktok_footer.png" alt="TikTok">
                </a>
            </div>

            <p class="copyright">
                © 2026 DMK Fishing Store · Todos los derechos reservados
            </p>
            </footer>

    </main>

</body>

</html>
